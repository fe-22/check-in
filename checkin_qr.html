<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in com QR Code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="text-center">Check-in com QR Code</h3>
                    </div>
                    <div class="card-body">
                        <div id="alert-container">
                            {% with messages = get_flashed_messages(with_categories=true) %}
                                {% if messages %}
                                    {% for category, message in messages %}
                                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                            {{ message }}
                                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                        </div>
                                    {% endfor %}
                                {% endif %}
                            {% endwith %}
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3 text-center">
                                    <video id="qr-video" width="100%" playsinline style="border: 1px solid #ccc;"></video>
                                    <div id="cam-error" class="text-danger mt-2" style="display: none;"></div>
                                </div>
                                <button id="start-camera" class="btn btn-primary w-100">Iniciar Câmera</button>
                            </div>
                            <div class="col-md-6">
                                <h5 class="text-center mb-3">OU</h5>
                                <form method="POST" action="{{ url_for('checkin_qr') }}">
                                    <div class="mb-3">
                                        <label for="identificador" class="form-label">Digite o ID ou E-mail:</label>
                                        <input type="text" class="form-control" id="identificador" name="identificador" required>
                                    </div>
                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-secondary">Registrar Check-in Manual</button>
                                        <a href="{{ url_for('index') }}" class="btn btn-outline-primary">Voltar para Cadastro</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const video = document.getElementById("qr-video");
        const startCameraBtn = document.getElementById("start-camera");
        const camError = document.getElementById("cam-error");
        const alertContainer = document.getElementById("alert-container");
        let stream = null;

        // Iniciar câmera
        startCameraBtn.addEventListener("click", async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                video.srcObject = stream;
                video.play();
                startQRScan();
                startCameraBtn.style.display = "none";
            } catch (err) {
                camError.style.display = "block";
                camError.textContent = "Erro ao acessar a câmera: " + err.message;
            }
        });

        // Escanear QR Code
        function startQRScan() {
            const canvas = document.createElement("canvas");
            const canvasContext = canvas.getContext("2d");
            
            function scanQR() {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvasContext.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    const imageData = canvasContext.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);
                    
                    if (code) {
                        registerCheckin(code.data);
                    }
                }
                requestAnimationFrame(scanQR);
            }
            scanQR();
        }

        // Registrar check-in via AJAX
        function registerCheckin(qrData) {
            fetch("{{ url_for('checkin_qr') }}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ qr_data: qrData }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showAlert("success", data.message);
                    if (stream) {
                        stream.getTracks().forEach(track => track.stop());
                    }
                    setTimeout(() => {
                        if (stream) {
                            stream.getTracks().forEach(track => track.stop());
                            video.srcObject = null;
                            startCameraBtn.style.display = "block";
                        }
                    }, 2000);
                } else {
                    showAlert("danger", data.message);
                }
            })
            .catch(error => {
                showAlert("danger", "Erro ao registrar check-in: " + error.message);
            });
        }

        function showAlert(type, message) {
            const alertDiv = document.createElement("div");
            alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
            alertDiv.role = "alert";
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            `;
            alertContainer.prepend(alertDiv);
        }
    </script>
</body>
</html>
