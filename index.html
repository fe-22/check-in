<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Check-in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="text-center">Sistema de Check-in</h3>
                    </div>
                    <div class="card-body text-center">
                        <h4 class="mb-4">Selecione uma opção:</h4>
                        
                        <div class="d-grid gap-3">
                            <a href="{{ url_for('cadastrar') }}" class="btn btn-primary btn-lg">
                                Novo Cadastro
                            </a>
                            
                            <a href="{{ url_for('checkin_rapido') }}" class="btn btn-success btn-lg">
                                Já sou cadastrado
                            </a>
                            
                            <a href="{{ url_for('login_lider') }}" class="btn btn-secondary btn-lg">
                                Área de Líderes
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
